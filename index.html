<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>learn-attention</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .prereqs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .prereqs-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #7d8590;
    }

    .float-legend {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #7d8590;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .prereqs-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .op-badge {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .op-sig {
      min-width: 52px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .num-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid #58a6ff;
      background: rgba(88, 166, 255, 0.12);
      box-sizing: border-box;
      flex-shrink: 0;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .num-circle.sm {
      width: 11px;
      height: 11px;
      border-width: 1.5px;
    }

    .num-circle.has-e {
      width: 16px;
      height: 16px;
    }

    .num-circle.has-e .sym {
      font-size: 0.7rem;
      line-height: 1;
      font-weight: 600;
      color: #f85149;
      transform: translateY(-0.5px);
    }

    .num-circle.highlight {
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.7);
      border-color: #79c0ff;
    }

    .op-add { color: #3fb950; }
    .op-mul { color: #f0883e; }
    .op-exp { color: #f85149; }
    .op-div { color: #d29922; }

    .op-badge.add .sym { color: #3fb950; font-weight: 600; }
    .op-badge.mul .sym { color: #f0883e; font-weight: 600; }
    .op-badge.exp .sym { color: #f85149; font-weight: 600; }
    .op-badge.div .sym { color: #d29922; font-weight: 600; }

    .filter-btn[data-op="add"].active { background: rgba(63, 185, 80, 0.15); border-color: #3fb950; color: #3fb950; }
    .filter-btn[data-op="mul"].active { background: rgba(240, 136, 62, 0.15); border-color: #f0883e; color: #f0883e; }
    .filter-btn[data-op="exp"].active { background: rgba(248, 81, 73, 0.15); border-color: #f85149; color: #f85149; }
    .filter-btn[data-op="div"].active { background: rgba(210, 153, 34, 0.15); border-color: #d29922; color: #d29922; }

    .dot-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.4rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      user-select: none;
      cursor: pointer;
    }

    .dot-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #7d8590;
    }

    .anim-stage {
      position: relative;
      width: 100%;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .bracket-wing {
      position: absolute;
      width: 8px;
      height: 30px;
      border: 1.5px solid #484f58;
      box-sizing: border-box;
      will-change: transform, opacity, border-color;
    }

    .bracket-wing.left {
      border-right: none;
      border-radius: 4px 0 0 4px;
    }

    .bracket-wing.right {
      border-left: none;
      border-radius: 0 4px 4px 0;
    }

    .anim-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid #58a6ff;
      background: rgba(88, 166, 255, 0.15);
      box-sizing: border-box;
      will-change: transform, opacity, background, border-color, box-shadow;
    }

    .stage-caption {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: #7d8590;
      height: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .caption-op { font-weight: 600; }
    .caption-op.mul { color: #f0883e; }
    .caption-op.add { color: #3fb950; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .filters {
      display: flex;
      gap: 0.35rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: ui-monospace, monospace;
      line-height: 1.2;
    }

    .filter-btn[data-op="div"] {
      font-size: 1rem;
    }

    .filter-btn:hover {
      color: #fff;
      border-color: #8b949e;
    }

    .filter-btn.active {
      background: #30363d;
      color: #fff;
    }

    .problem {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 2.5rem;
      color: #fff;
      letter-spacing: 0.04em;
      margin: 0.25rem 0;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    input[type="text"] {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      color: #fff;
      font-size: 1.1rem;
      font-family: ui-monospace, monospace;
      text-align: center;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #58a6ff;
    }

    button.submit-btn {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
    }

    button.submit-btn:hover {
      background: #2ea043;
    }

    button.submit-btn.incorrect {
      background: #21262d;
      border: 1px solid #da3633;
      color: #f0f6fc;
    }

    button.submit-btn.incorrect:hover {
      background: #30363d;
      border-color: #f85149;
    }

    .feedback {
      font-size: 0.85rem;
      min-height: 1.2rem;
      text-align: center;
    }

    .feedback.correct { color: #3fb950; }
    .feedback.incorrect { color: #f85149; }

    .stats {
      width: 100%;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #21262d;
      padding-top: 0.85rem;
      font-size: 0.8rem;
      color: #7d8590;
    }

    .stats span {
      color: #c9d1d9;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="prereqs-header">
        <div class="prereqs-label">Prerequisites</div>
        <div class="float-legend">
          <span class="num-circle sm"></span>
          <span>number</span>
        </div>
      </div>
      <div class="prereqs-list">
        <div class="op-badge add">
          <span class="op-sig">
            <span class="num-circle"></span>
            <span class="sym">+</span>
            <span class="num-circle"></span>
          </span>
          <span class="op-name">add</span>
        </div>
        <div class="op-badge mul">
          <span class="op-sig">
            <span class="num-circle"></span>
            <span class="sym">&times;</span>
            <span class="num-circle"></span>
          </span>
          <span class="op-name">multiply</span>
        </div>
        <div class="op-badge exp">
          <span class="op-sig">
            <span class="num-circle has-e"><span class="sym">e</span></span>
          </span>
          <span class="op-name">exp</span>
        </div>
        <div class="op-badge div">
          <span class="op-sig">
            <span class="num-circle"></span>
            <span class="sym">&divide;</span>
            <span class="num-circle"></span>
          </span>
          <span class="op-name">divide</span>
        </div>
      </div>
    </header>

    <div class="dot-card" id="dot-card" title="Click to replay">
      <div class="dot-header">
        <span>Dot Product</span>
        <span>Vector of 4</span>
      </div>

      <div class="anim-stage" id="stage">
        <!-- Brackets: Top Left/Right, Bottom Left/Right -->
        <div class="bracket-wing left" id="b-tl"></div>
        <div class="bracket-wing right" id="b-tr"></div>
        <div class="bracket-wing left" id="b-bl"></div>
        <div class="bracket-wing right" id="b-br"></div>

        <!-- 8 Dots: T0..T3 and B0..B3 -->
        <div class="anim-dot" id="dot-t0"></div>
        <div class="anim-dot" id="dot-t1"></div>
        <div class="anim-dot" id="dot-t2"></div>
        <div class="anim-dot" id="dot-t3"></div>

        <div class="anim-dot" id="dot-b0"></div>
        <div class="anim-dot" id="dot-b1"></div>
        <div class="anim-dot" id="dot-b2"></div>
        <div class="anim-dot" id="dot-b3"></div>
      </div>

      <div class="stage-caption" id="caption">Two vectors of 4</div>
    </div>

    <div class="card">
      <div class="filters">
        <button class="filter-btn active" data-op="all">all</button>
        <button class="filter-btn" data-op="add">+</button>
        <button class="filter-btn" data-op="mul">&times;</button>
        <button class="filter-btn" data-op="exp">exp</button>
        <button class="filter-btn" data-op="div">&divide;</button>
      </div>

      <div class="problem" id="problem">...</div>

      <div class="input-row">
        <input type="text" id="answer" placeholder="answer" autocomplete="off" inputmode="decimal" />
        <button class="submit-btn" id="submit">Check</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="stats">
        <div>streak: <span id="stat-streak">0</span></div>
        <div>solved: <span id="stat-solved">0</span></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      let currentOp = 'all';
      let currentProblem = null;
      let isAnswered = false;
      let streak = 0;
      let solved = 0;

      const problemEl = document.getElementById('problem');
      const inputEl = document.getElementById('answer');
      const submitBtn = document.getElementById('submit');
      const feedbackEl = document.getElementById('feedback');
      const streakEl = document.getElementById('stat-streak');
      const solvedEl = document.getElementById('stat-solved');
      const filterBtns = document.querySelectorAll('.filter-btn');

      function randChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function randFloat(min, max, step = 0.5) {
        const steps = Math.round((max - min) / step);
        return parseFloat((min + Math.floor(Math.random() * (steps + 1)) * step).toFixed(1));
      }

      const generators = {
        add: () => {
          const a = randFloat(0.5, 6.0, 0.5);
          const b = randFloat(0.5, 6.0, 0.5);
          return { html: `${a} <span class="op-add">+</span> ${b}`, target: a + b };
        },
        mul: () => {
          const a = randChoice([0.5, 1.5, 2.0, 2.5, 3.0, 4.0]);
          const b = randChoice([0.2, 0.5, 1.5, 2.0, 3.0]);
          return { html: `${a} <span class="op-mul">\u00d7</span> ${b}`, target: a * b };
        },
        exp: () => {
          const choices = [
            { html: '<span class="op-exp">exp</span>(-\u221e)', target: 0, allowsE: false },
            { html: '<span class="op-exp">exp</span>(0)', target: 1, allowsE: false },
            { html: '<span class="op-exp">exp</span>(1)', target: Math.E, allowsE: true },
            { html: '<span class="op-exp">exp</span>(-1.0)', target: Math.exp(-1.0), allowsE: false },
            { html: '<span class="op-exp">exp</span>(-0.5)', target: Math.exp(-0.5), allowsE: false },
            { html: '<span class="op-exp">exp</span>(0.5)', target: Math.exp(0.5), allowsE: false },
            { html: '<span class="op-exp">exp</span>(1.5)', target: Math.exp(1.5), allowsE: false },
            { html: '<span class="op-exp">exp</span>(2.0)', target: Math.exp(2.0), allowsE: false }
          ];
          return randChoice(choices);
        },
        div: () => {
          const divisor = randChoice([2, 4, 5, 1.5, 0.5]);
          const target = randChoice([0.5, 1.0, 1.5, 2.0, 3.0, 4.0]);
          const dividend = parseFloat((divisor * target).toFixed(1));
          return { html: `${dividend} <span class="op-div">\u00f7</span> ${divisor}`, target: dividend / divisor };
        }
      };

      function nextProblem() {
        isAnswered = false;
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        inputEl.value = '';
        submitBtn.className = 'submit-btn';
        submitBtn.textContent = 'Check';
        inputEl.focus();

        let op = currentOp;
        if (op === 'all') {
          op = randChoice(['add', 'mul', 'exp', 'div']);
        }

        currentProblem = generators[op]();
        problemEl.innerHTML = currentProblem.html;
      }

      function checkAnswer() {
        if (!currentProblem) return;
        const raw = inputEl.value.trim().toLowerCase().replace(',', '.');
        if (!raw) return;

        let isCorrect = false;

        if (currentProblem.allowsE && raw === 'e') {
          isCorrect = true;
        } else {
          const val = parseFloat(raw);
          if (isNaN(val)) {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = 'enter a valid number';
            return;
          }

          const diff = Math.abs(val - currentProblem.target);
          isCorrect = diff <= 0.1001 || Math.abs(parseFloat(val.toFixed(1)) - parseFloat(currentProblem.target.toFixed(1))) < 1e-5;
        }

        const targetDisplay = currentProblem.allowsE
          ? `~${currentProblem.target.toFixed(1)} (or e)`
          : (currentProblem.target === 0 ? '0' : `~${currentProblem.target.toFixed(1)}`);

        isAnswered = true;

        if (isCorrect) {
          streak++;
          solved++;
          feedbackEl.className = 'feedback correct';
          feedbackEl.textContent = `\u2713 correct! (${targetDisplay})`;
          submitBtn.className = 'submit-btn';
          submitBtn.textContent = 'Next \u2192';
        } else {
          streak = 0;
          feedbackEl.className = 'feedback incorrect';
          feedbackEl.textContent = `\u2715 target was ${targetDisplay}`;
          submitBtn.className = 'submit-btn incorrect';
          submitBtn.innerHTML = 'Next <span style="color:#f85149">\u2715</span>';
        }

        streakEl.textContent = streak;
        solvedEl.textContent = solved;
      }

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentOp = btn.dataset.op;
          nextProblem();
        });
      });

      submitBtn.addEventListener('click', () => {
        if (isAnswered) nextProblem();
        else checkAnswer();
      });

      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (isAnswered) nextProblem();
          else checkAnswer();
        }
      });

      // Dot Product animation
      (function initDotAnimation() {
        const X_COORDS = [-51, -17, 17, 51];
        const BRACKET_OFFSET = 24;
        const X_BRACKET_L = -51 - BRACKET_OFFSET;
        const X_BRACKET_R = 51 + BRACKET_OFFSET;
        
        const Y_TOP = -37;
        const Y_BOTTOM = 37;
        const Y_MID = 0;

        const tDots = [0,1,2,3].map(i => document.getElementById('dot-t' + i));
        const bDots = [0,1,2,3].map(i => document.getElementById('dot-b' + i));
        const bTL = document.getElementById('b-tl');
        const bTR = document.getElementById('b-tr');
        const bBL = document.getElementById('b-bl');
        const bBR = document.getElementById('b-br');
        const caption = document.getElementById('caption');
        const card = document.getElementById('dot-card');

        if (!card || !caption || !bTL) return;

        function setPos(el, x, y, scale = 1) {
          el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        }

        function resetStyles() {
          caption.style.opacity = '1';
          caption.innerHTML = 'Two vectors of 4';

          setPos(bTL, X_BRACKET_L, Y_TOP);
          setPos(bTR, X_BRACKET_R, Y_TOP);
          setPos(bBL, X_BRACKET_L, Y_BOTTOM);
          setPos(bBR, X_BRACKET_R, Y_BOTTOM);

          [bTL, bTR, bBL, bBR].forEach(b => {
            b.style.opacity = '1';
            b.style.borderColor = '#484f58';
          });

          for (let i = 0; i < 4; i++) {
            setPos(tDots[i], X_COORDS[i], Y_TOP);
            setPos(bDots[i], X_COORDS[i], Y_BOTTOM);
            
            tDots[i].style.opacity = '1';
            tDots[i].style.borderColor = '#58a6ff';
            tDots[i].style.background = 'rgba(88, 166, 255, 0.15)';
            tDots[i].style.boxShadow = 'none';

            bDots[i].style.opacity = '1';
            bDots[i].style.borderColor = '#58a6ff';
            bDots[i].style.background = 'rgba(88, 166, 255, 0.15)';
            bDots[i].style.boxShadow = 'none';
          }
        }

        const TOTAL_DURATION = 7400;

        function update(ms) {
          if (ms < 1200) {
            resetStyles();
            return;
          }

          if (ms >= 1200 && ms < 2500) {
            caption.innerHTML = '<span class="caption-op mul">&times; multiply</span> pairwise';

            const p = (ms - 1200) / 1300;
            const moveProgress = Math.min(1, p / 0.85);
            const ease = moveProgress < 1 ? moveProgress * moveProgress * (3 - 2 * moveProgress) : 1;
            
            const curYTop = Y_TOP + (Y_MID - Y_TOP) * ease;
            const curYBottom = Y_BOTTOM + (Y_MID - Y_BOTTOM) * ease;

            setPos(bTL, X_BRACKET_L, curYTop);
            setPos(bTR, X_BRACKET_R, curYTop);
            setPos(bBL, X_BRACKET_L, curYBottom);
            setPos(bBR, X_BRACKET_R, curYBottom);

            if (p >= 0.85) {
              const flashPhase = (p - 0.85) / 0.15;
              const flash = Math.sin(flashPhase * Math.PI);
              const scale = 1 + 0.35 * flash;

              for (let i = 0; i < 4; i++) {
                setPos(tDots[i], X_COORDS[i], Y_MID, scale);
                tDots[i].style.borderColor = '#f0883e';
                tDots[i].style.background = `rgba(240, 136, 62, ${0.2 + 0.8 * flash})`;
                tDots[i].style.boxShadow = `0 0 ${20 * flash}px #f0883e, 0 0 ${35 * flash}px rgba(240, 136, 62, 0.85)`;
                
                bDots[i].style.opacity = `${Math.max(0, 1 - flashPhase * 2)}`;
                setPos(bDots[i], X_COORDS[i], Y_MID, scale);
              }

              bBL.style.opacity = `${Math.max(0, 1 - flashPhase * 2)}`;
              bBR.style.opacity = `${Math.max(0, 1 - flashPhase * 2)}`;
              
              bTL.style.borderColor = flash > 0.4 ? '#f0883e' : '#484f58';
              bTR.style.borderColor = flash > 0.4 ? '#f0883e' : '#484f58';
            } else {
              for (let i = 0; i < 4; i++) {
                setPos(tDots[i], X_COORDS[i], curYTop);
                setPos(bDots[i], X_COORDS[i], curYBottom);
              }
            }
            return;
          }

          if (ms >= 2500 && ms < 3500) {
            caption.innerHTML = '4 products &rarr; <span class="caption-op add">+ add</span> together';

            setPos(bTL, X_BRACKET_L, Y_MID);
            setPos(bTR, X_BRACKET_R, Y_MID);
            bTL.style.opacity = '1';
            bTR.style.opacity = '1';
            bTL.style.borderColor = '#484f58';
            bTR.style.borderColor = '#484f58';

            bBL.style.opacity = '0';
            bBR.style.opacity = '0';

            for (let i = 0; i < 4; i++) {
              bDots[i].style.opacity = '0';
              tDots[i].style.opacity = '1';
              setPos(tDots[i], X_COORDS[i], Y_MID, 1);
              tDots[i].style.borderColor = '#58a6ff';
              tDots[i].style.background = 'rgba(88, 166, 255, 0.15)';
              tDots[i].style.boxShadow = 'none';
            }
            return;
          }

          if (ms >= 3500 && ms < 4800) {
            caption.innerHTML = '<span class="caption-op add">+ add</span> together';
            const p = (ms - 3500) / 1300;
            const moveProgress = Math.min(1, p / 0.85);
            const ease = moveProgress < 1 ? moveProgress * moveProgress * (3 - 2 * moveProgress) : 1;

            const curX0 = X_COORDS[0] * (1 - ease);
            const curX3 = X_COORDS[3] * (1 - ease);

            const curBracketL = curX0 - BRACKET_OFFSET * (1 - ease * 0.7);
            const curBracketR = curX3 + BRACKET_OFFSET * (1 - ease * 0.7);

            setPos(bTL, curBracketL, Y_MID);
            setPos(bTR, curBracketR, Y_MID);

            if (p >= 0.85) {
              const flashPhase = (p - 0.85) / 0.15;
              const flash = Math.sin(flashPhase * Math.PI);
              const scale = 1 + 0.45 * flash;

              setPos(tDots[0], 0, Y_MID, scale);
              tDots[0].style.borderColor = '#3fb950';
              tDots[0].style.background = `rgba(63, 185, 80, ${0.2 + 0.8 * flash})`;
              tDots[0].style.boxShadow = `0 0 ${25 * flash}px #3fb950, 0 0 ${45 * flash}px rgba(63, 185, 80, 0.9)`;

              for (let i = 1; i < 4; i++) {
                tDots[i].style.opacity = `${Math.max(0, 1 - flashPhase * 2)}`;
                setPos(tDots[i], 0, Y_MID, scale);
              }

              const bFade = Math.max(0, 1 - flashPhase * 1.5);
              bTL.style.opacity = `${bFade}`;
              bTR.style.opacity = `${bFade}`;
              bTL.style.borderColor = '#3fb950';
              bTR.style.borderColor = '#3fb950';
            } else {
              for (let i = 0; i < 4; i++) {
                const curX = X_COORDS[i] * (1 - ease);
                setPos(tDots[i], curX, Y_MID);
                tDots[i].style.opacity = '1';
              }
              bTL.style.opacity = '1';
              bTR.style.opacity = '1';
            }
            return;
          }

          if (ms >= 4800 && ms < 6500) {
            caption.innerHTML = '= 1 number <span style="color:#58a6ff; font-weight:600;">(scalar)</span>';
            bTL.style.opacity = '0';
            bTR.style.opacity = '0';
            bBL.style.opacity = '0';
            bBR.style.opacity = '0';

            for (let i = 1; i < 4; i++) tDots[i].style.opacity = '0';
            
            setPos(tDots[0], 0, Y_MID, 1.15);
            tDots[0].style.opacity = '1';
            tDots[0].style.borderColor = '#58a6ff';
            tDots[0].style.background = 'rgba(88, 166, 255, 0.2)';
            tDots[0].style.boxShadow = '0 0 14px rgba(88, 166, 255, 0.5)';
            return;
          }

          if (ms >= 6500) {
            const fade = 1 - (ms - 6500) / 900;
            tDots[0].style.opacity = `${fade}`;
            caption.style.opacity = `${fade}`;
            bTL.style.opacity = '0';
            bTR.style.opacity = '0';
          }
        }

        let startTime = performance.now();
        function animLoop(now) {
          const elapsed = (now - startTime) % TOTAL_DURATION;
          update(elapsed);
          requestAnimationFrame(animLoop);
        }
        requestAnimationFrame(animLoop);

        card.addEventListener('click', () => {
          startTime = performance.now();
        });
      })();

      nextProblem();
    })();
  </script>
</body>
