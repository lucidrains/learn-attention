<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>learn-attention</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .prereqs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .prereqs-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #7d8590;
    }

    .float-legend {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #7d8590;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .prereqs-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .op-badge {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .op-sig {
      min-width: 52px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .num-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid #58a6ff;
      background: rgba(88, 166, 255, 0.12);
      box-sizing: border-box;
      flex-shrink: 0;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .num-circle.sm {
      width: 11px;
      height: 11px;
      border-width: 1.5px;
    }

    .num-circle.has-e {
      width: 16px;
      height: 16px;
    }

    .num-circle.has-e .sym {
      font-size: 0.7rem;
      line-height: 1;
      font-weight: 600;
      color: #f85149;
      transform: translateY(-0.5px);
    }

    .num-circle.highlight {
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.7);
      border-color: #79c0ff;
    }

    .op-add { color: #3fb950; }
    .op-mul { color: #f0883e; }
    .op-exp { color: #f85149; }
    .op-div { color: #a371f7; }

    .op-badge.add .sym { color: #3fb950; font-weight: 600; }
    .op-badge.mul .sym { color: #f0883e; font-weight: 600; }
    .op-badge.exp .sym { color: #f85149; font-weight: 600; }
    .op-badge.div .sym { color: #a371f7; font-weight: 600; }

    .filter-btn[data-op="add"].active { background: rgba(63, 185, 80, 0.15); border-color: #3fb950; color: #3fb950; }
    .filter-btn[data-op="mul"].active { background: rgba(240, 136, 62, 0.15); border-color: #f0883e; color: #f0883e; }
    .filter-btn[data-op="exp"].active { background: rgba(248, 81, 73, 0.15); border-color: #f85149; color: #f85149; }
    .filter-btn[data-op="div"].active { background: rgba(163, 113, 247, 0.15); border-color: #a371f7; color: #a371f7; }

    .dot-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.4rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      user-select: none;
    }

    .dot-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #7d8590;
    }

    .slider-row {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.2rem 0;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #7d8590;
    }

    .slider-val {
      color: #58a6ff;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      background: #21262d;
      height: 6px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #58a6ff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.6);
      border: 2px solid #fff;
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .canvas-stage {
      position: relative;
      width: 100%;
      height: 170px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stage-caption {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: #7d8590;
      height: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .caption-op { font-weight: 600; }
    .caption-op.mul { color: #f0883e; }
    .caption-op.add { color: #3fb950; }
    .caption-op.exp { color: #f85149; }
    .caption-op.div { color: #a371f7; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .filters {
      display: flex;
      gap: 0.35rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: ui-monospace, monospace;
      line-height: 1.2;
    }

    .filter-btn[data-op="div"] {
      font-size: 1rem;
    }

    .filter-btn:hover {
      color: #fff;
      border-color: #8b949e;
    }

    .filter-btn.active {
      background: #30363d;
      color: #fff;
    }

    .problem {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 2.5rem;
      color: #fff;
      letter-spacing: 0.04em;
      margin: 0.25rem 0;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    input[type="text"] {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      color: #fff;
      font-size: 1.1rem;
      font-family: ui-monospace, monospace;
      text-align: center;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #58a6ff;
    }

    button.submit-btn {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
    }

    button.submit-btn:hover {
      background: #2ea043;
    }

    button.submit-btn.incorrect {
      background: #21262d;
      border: 1px solid #da3633;
      color: #f0f6fc;
    }

    button.submit-btn.incorrect:hover {
      background: #30363d;
      border-color: #f85149;
    }

    .feedback {
      font-size: 0.85rem;
      min-height: 1.2rem;
      text-align: center;
    }

    .feedback.correct { color: #3fb950; }
    .feedback.incorrect { color: #f85149; }

    .stats {
      width: 100%;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #21262d;
      padding-top: 0.85rem;
      font-size: 0.8rem;
      color: #7d8590;
    }

    .stats span {
      color: #c9d1d9;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="prereqs-header">
        <div class="prereqs-label">Prerequisites</div>
        <div class="float-legend">
          <span class="num-circle sm"></span>
          <span>number</span>
        </div>
      </div>
      <div class="prereqs-list">
        <div class="op-badge add">
          <span class="op-sig">
            <span class="num-circle"></span>
            <span class="sym">+</span>
            <span class="num-circle"></span>
          </span>
          <span class="op-name">add</span>
        </div>
        <div class="op-badge mul">
          <span class="op-sig">
            <span class="num-circle"></span>
            <span class="sym">&times;</span>
            <span class="num-circle"></span>
          </span>
          <span class="op-name">multiply</span>
        </div>
        <div class="op-badge exp">
          <span class="op-sig">
            <span class="num-circle has-e"><span class="sym">e</span></span>
          </span>
          <span class="op-name">exp</span>
        </div>
        <div class="op-badge div">
          <span class="op-sig">
            <span class="num-circle"></span>
            <span class="sym">&divide;</span>
            <span class="num-circle"></span>
          </span>
          <span class="op-name">divide</span>
        </div>
      </div>
    </header>

    <div class="card">
      <div class="filters">
        <button class="filter-btn active" data-op="all">all</button>
        <button class="filter-btn" data-op="add">+</button>
        <button class="filter-btn" data-op="mul">&times;</button>
        <button class="filter-btn" data-op="exp">exp</button>
        <button class="filter-btn" data-op="div">&divide;</button>
      </div>

      <div class="problem" id="problem">...</div>

      <div class="input-row">
        <input type="text" id="answer" placeholder="answer" autocomplete="off" inputmode="decimal" />
        <button class="submit-btn" id="submit">Check</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="stats">
        <div>streak: <span id="stat-streak">0</span></div>
        <div>solved: <span id="stat-solved">0</span></div>
      </div>
    </div>

    <div class="dot-card" id="dot-card">
      <div class="dot-header">
        <span>Dot Product</span>
        <span id="header-dim">Vector of 4</span>
      </div>

      <div class="slider-row">
        <div class="slider-labels">
          <span>dimension (power of 2)</span>
          <span class="slider-val" id="slider-label">4</span>
        </div>
        <input type="range" id="dim-slider" min="0" max="12" value="0" step="1" />
      </div>

      <div class="canvas-stage" id="canvas-stage" title="Click to replay">
        <canvas id="anim-canvas"></canvas>
      </div>

      <div class="stage-caption" id="caption">Two vectors of 4</div>
    </div>

    <div class="dot-card" id="softmax-card">
      <div class="dot-header">
        <span>Softmax</span>
        <span id="softmax-header-dim">Vector of 4</span>
      </div>

      <div class="slider-row">
        <div class="slider-labels">
          <span>dimension (power of 2)</span>
          <span class="slider-val" id="softmax-slider-label">4</span>
        </div>
        <input type="range" id="softmax-dim-slider" min="0" max="12" value="0" step="1" />
      </div>

      <div class="canvas-stage" id="softmax-canvas-stage" title="Click to replay">
        <canvas id="softmax-canvas"></canvas>
      </div>

      <div class="stage-caption" id="softmax-caption">Vector of 4</div>
    </div>
  </div>

  <script>
    (function () {
      let currentOp = 'all';
      let currentProblem = null;
      let isAnswered = false;
      let streak = 0;
      let solved = 0;

      const problemEl = document.getElementById('problem');
      const inputEl = document.getElementById('answer');
      const submitBtn = document.getElementById('submit');
      const feedbackEl = document.getElementById('feedback');
      const streakEl = document.getElementById('stat-streak');
      const solvedEl = document.getElementById('stat-solved');
      const filterBtns = document.querySelectorAll('.filter-btn');

      function randChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function randFloat(min, max, step = 0.5) {
        const steps = Math.round((max - min) / step);
        return parseFloat((min + Math.floor(Math.random() * (steps + 1)) * step).toFixed(1));
      }

      const generators = {
        add: () => {
          const a = randFloat(0.5, 6.0, 0.5);
          const b = randFloat(0.5, 6.0, 0.5);
          return { html: `${a} <span class="op-add">+</span> ${b}`, target: a + b };
        },
        mul: () => {
          const a = randChoice([0.5, 1.5, 2.0, 2.5, 3.0, 4.0]);
          const b = randChoice([0.2, 0.5, 1.5, 2.0, 3.0]);
          return { html: `${a} <span class="op-mul">\u00d7</span> ${b}`, target: a * b };
        },
        exp: () => {
          const choices = [
            { html: '<span class="op-exp">exp</span>(-\u221e)', target: 0, allowsE: false },
            { html: '<span class="op-exp">exp</span>(0)', target: 1, allowsE: false },
            { html: '<span class="op-exp">exp</span>(1)', target: Math.E, allowsE: true },
            { html: '<span class="op-exp">exp</span>(-1.0)', target: Math.exp(-1.0), allowsE: false },
            { html: '<span class="op-exp">exp</span>(-0.5)', target: Math.exp(-0.5), allowsE: false },
            { html: '<span class="op-exp">exp</span>(0.5)', target: Math.exp(0.5), allowsE: false },
            { html: '<span class="op-exp">exp</span>(1.5)', target: Math.exp(1.5), allowsE: false },
            { html: '<span class="op-exp">exp</span>(2.0)', target: Math.exp(2.0), allowsE: false }
          ];
          return randChoice(choices);
        },
        div: () => {
          const divisor = randChoice([2, 4, 5, 1.5, 0.5]);
          const target = randChoice([0.5, 1.0, 1.5, 2.0, 3.0, 4.0]);
          const dividend = parseFloat((divisor * target).toFixed(1));
          return { html: `${dividend} <span class="op-div">\u00f7</span> ${divisor}`, target: dividend / divisor };
        }
      };

      function nextProblem() {
        isAnswered = false;
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        inputEl.value = '';
        submitBtn.className = 'submit-btn';
        submitBtn.textContent = 'Check';
        inputEl.focus();

        let op = currentOp;
        if (op === 'all') {
          op = randChoice(['add', 'mul', 'exp', 'div']);
        }

        currentProblem = generators[op]();
        problemEl.innerHTML = currentProblem.html;
      }

      function checkAnswer() {
        if (!currentProblem) return;
        const raw = inputEl.value.trim().toLowerCase().replace(',', '.');
        if (!raw) return;

        let isCorrect = false;

        if (currentProblem.allowsE && raw === 'e') {
          isCorrect = true;
        } else {
          const val = parseFloat(raw);
          if (isNaN(val)) {
            feedbackEl.className = 'feedback incorrect';
            feedbackEl.textContent = 'enter a valid number';
            return;
          }

          const diff = Math.abs(val - currentProblem.target);
          isCorrect = diff <= 0.1001 || Math.abs(parseFloat(val.toFixed(1)) - parseFloat(currentProblem.target.toFixed(1))) < 1e-5;
        }

        const targetDisplay = currentProblem.allowsE
          ? `~${currentProblem.target.toFixed(1)} (or e)`
          : (currentProblem.target === 0 ? '0' : `~${currentProblem.target.toFixed(1)}`);

        isAnswered = true;

        if (isCorrect) {
          streak++;
          solved++;
          feedbackEl.className = 'feedback correct';
          feedbackEl.textContent = `\u2713 correct! (${targetDisplay})`;
          submitBtn.className = 'submit-btn';
          submitBtn.textContent = 'Next \u2192';
        } else {
          streak = 0;
          feedbackEl.className = 'feedback incorrect';
          feedbackEl.textContent = `\u2715 target was ${targetDisplay}`;
          submitBtn.className = 'submit-btn incorrect';
          submitBtn.innerHTML = 'Next <span style="color:#f85149">\u2715</span>';
        }

        streakEl.textContent = streak;
        solvedEl.textContent = solved;
      }

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentOp = btn.dataset.op;
          nextProblem();
        });
      });

      submitBtn.addEventListener('click', () => {
        if (isAnswered) nextProblem();
        else checkAnswer();
      });

      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (isAnswered) nextProblem();
          else checkAnswer();
        }
      });

      // Dot Product animation (Canvas based, scales from 4 to 16,384)
      (function initDotCanvasAnimation() {
        const POWERS = [4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384];
        let currentPowerIdx = 0;
        let N = POWERS[currentPowerIdx];

        const slider = document.getElementById('dim-slider');
        const sliderLabel = document.getElementById('slider-label');
        const headerDim = document.getElementById('header-dim');
        const caption = document.getElementById('caption');
        const canvasStage = document.getElementById('canvas-stage');
        const canvas = document.getElementById('anim-canvas');
        if (!canvas || !slider) return;

        const ctx = canvas.getContext('2d');
        let width = 0;
        let height = 0;
        let dpr = window.devicePixelRatio || 1;

        function resize() {
          const rect = canvas.getBoundingClientRect();
          width = rect.width;
          height = rect.height;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        function updateDim(idx) {
          currentPowerIdx = Math.max(0, Math.min(POWERS.length - 1, idx));
          slider.value = currentPowerIdx;
          N = POWERS[currentPowerIdx];
          sliderLabel.textContent = N.toLocaleString();
          headerDim.textContent = "Vector of " + N.toLocaleString();
          startTime = performance.now();
        }

        slider.addEventListener('input', (e) => {
          updateDim(parseInt(e.target.value, 10));
        });

        const DOT_DATA = {
          4: {
            a: ['1.0', '2.0', '3.0', '1.0'],
            b: ['2.0', '1.0', '0.5', '2.0'],
            mul: ['2.0', '2.0', '1.5', '2.0'],
            sum: '7.5'
          },
          8: {
            a: ['1', '2', '1', '3', '2', '1', '2', '1'],
            b: ['2', '1', '2', '1', '1', '2', '1', '2'],
            mul: ['2', '2', '2', '3', '2', '2', '2', '2'],
            sum: '17'
          }
        };

        function getParticlesLayout(count, availableW, availableH) {
          if (count <= 128) {
            const cols = count;
            const rows = 1;
            const spacing = availableW / cols;
            const maxRadius = count <= 4 ? 14 : (count <= 8 ? 11 : 8);
            const radius = Math.max(1.2, Math.min(maxRadius, (spacing * 0.65) / 2));
            const startX = -availableW / 2 + spacing / 2;

            const positions = [];
            for (let i = 0; i < count; i++) {
              positions.push({
                x: startX + i * spacing,
                y: 0,
                r: radius
              });
            }
            return { positions, cols, rows, radius, width: availableW, height: radius * 2 };
          }

          let cols = 64;
          if (count >= 2048) cols = 128;
          if (count >= 8192) cols = 256;

          const rows = Math.ceil(count / cols);
          const spacingX = availableW / cols;
          const maxGridH = Math.min(36, Math.max(12, rows * 1.5));
          const spacingY = rows > 1 ? maxGridH / (rows - 1) : 0;
          const radius = Math.max(0.5, Math.min(1.2, spacingX * 0.45));
          const startX = -availableW / 2 + spacingX / 2;
          const startY = -maxGridH / 2;

          const positions = [];
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (positions.length < count) {
                positions.push({
                  x: startX + c * spacingX,
                  y: rows > 1 ? startY + r * spacingY : 0,
                  r: radius
                });
              }
            }
          }
          return { positions, cols, rows, radius, width: availableW, height: maxGridH };
        }

        const TOTAL_DURATION = 7400;
        let startTime = performance.now();

        function render(ms) {
          ctx.clearRect(0, 0, width, height);

          const centerX = width / 2;
          const centerY = height / 2;

          const availW = Math.min(width - 50, 310);
          const availH = 34;
          const layout = getParticlesLayout(N, availW, availH);
          const data = DOT_DATA[N] || null;

          const Y_TOP = -42;
          const Y_BOTTOM = 42;
          const Y_MID = 0;

          const bracketW = availW + Math.max(18, layout.radius * 3.5);
          const bracketH = Math.max(28, layout.height + 14);
          const bracketL = -bracketW / 2;
          const bracketR = bracketW / 2;

          function drawBracket(x, y, h, isLeft, alpha = 1, color = "#484f58") {
            if (alpha <= 0) return;
            ctx.save();
            ctx.translate(centerX + x, centerY + y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            const wing = 6;
            if (isLeft) {
              ctx.moveTo(wing, -h / 2);
              ctx.lineTo(0, -h / 2);
              ctx.lineTo(0, h / 2);
              ctx.lineTo(wing, h / 2);
            } else {
              ctx.moveTo(-wing, -h / 2);
              ctx.lineTo(0, -h / 2);
              ctx.lineTo(0, h / 2);
              ctx.lineTo(-wing, h / 2);
            }
            ctx.stroke();
            ctx.restore();
          }

            // Numerator bracket
            const bColor = flash > 0.3 ? '#a371f7' : '#484f58';
            drawBracket(bracketL, Y_TOP, bracketH, true, 1, bColor);
            drawBracket(bracketR, Y_TOP, bracketH, false, 1, bColor);

            // Draw purple projection rays from sum scalar to numerator
            const rayAlpha = Math.max(0, Math.sin(p * Math.PI));
            if (rayAlpha > 0) {
              ctx.save();
              ctx.translate(centerX, centerY);

              // Soft radiant cone from scalar up to numerator
              const coneGrad = ctx.createLinearGradient(0, Y_BOTTOM, 0, Y_TOP);
              coneGrad.addColorStop(0, `rgba(163, 113, 247, ${rayAlpha * 0.28})`);
              coneGrad.addColorStop(1, `rgba(163, 113, 247, ${rayAlpha * 0.04})`);
              ctx.fillStyle = coneGrad;
              ctx.beginPath();
              ctx.moveTo(0, Y_BOTTOM);
              ctx.lineTo(-availW / 2, Y_TOP);
              ctx.lineTo(availW / 2, Y_TOP);
              ctx.closePath();
              ctx.fill();

              // Radiant purple projection lines
              ctx.strokeStyle = `rgba(163, 113, 247, ${rayAlpha * 0.65})`;
              ctx.lineWidth = 1.2;
              if (N <= 16) {
                for (let i = 0; i < N; i++) {
                  ctx.beginPath();
                  ctx.moveTo(0, Y_BOTTOM);
                  ctx.lineTo(layout.positions[i].x, Y_TOP);
                  ctx.stroke();
                }
              } else {
                const numRays = 48;
                for (let i = 0; i < numRays; i++) {
                  const targetX = -availW / 2 + (i / (numRays - 1)) * availW;
                  ctx.beginPath();
                  ctx.moveTo(0, Y_BOTTOM);
                  ctx.lineTo(targetX, Y_TOP);
                  ctx.stroke();
                }
              }
              ctx.restore();
            }

            // Draw denominator scalar circle (fading as division completes)
            const sumAlpha = Math.max(0, 1 - Math.max(0, (p - 0.5) / 0.5));
            if (sumAlpha > 0) {
              ctx.save();
              ctx.translate(centerX, centerY);
              ctx.globalAlpha = sumAlpha;
              const rFinal = Math.max(12, layout.radius);
              ctx.shadowColor = '#3fb950';
              ctx.shadowBlur = 10;
              ctx.beginPath();
              ctx.arc(0, Y_BOTTOM, rFinal, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(63, 185, 80, 0.3)';
              ctx.fill();
              ctx.lineWidth = 1.5;
              ctx.strokeStyle = '#3fb950';
              ctx.stroke();

              if (N <= 64 && rFinal >= 9.5 && data) {
                ctx.shadowBlur = 0;
                const maxChars = String(data.sum).length;
                const fontSize = Math.min(11, Math.max(7.5, Math.floor((rFinal * 1.8) / (maxChars * 0.65))));
                ctx.font = `600 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(data.sum, 0, Y_BOTTOM);
              }
              ctx.restore();
            }

            // Numerator circles transition from exp to normalized prob, flashing purple
            const strokeColor = isDivided ? '#a371f7' : '#f85149';
            const purpleBg = `rgba(163, 113, 247, ${0.2 + 0.6 * flash})`;
            const labels = isDivided && data ? data.prob : (data ? data.exp : null);
            drawDotBatch(layout.positions, Y_TOP, 1, 1, 1 + 0.15 * flash, strokeColor, purpleBg, flash * 20, '#a371f7', 1, labels, '#ffffff');
            return;
          }

          // 6600 -> 7600ms: Output normalized probabilities vector (moving back to center)
          if (ms >= 6600 && ms < 7600) {
            caption.innerHTML = `= Vector of ${N.toLocaleString()} <span style="color:#58a6ff; font-weight:600;">(sums to 1.0)</span>`;

            const p = Math.min(1, (ms - 6600) / 600);
            const ease = p * p * (3 - 2 * p);
            const curY = Y_TOP + (Y_MID - Y_TOP) * ease;

            drawBracket(bracketL, curY, bracketH, true);
            drawBracket(bracketR, curY, bracketH, false);

            drawDotBatch(layout.positions, curY, 1, 1, 1, '#58a6ff', 'rgba(88,166,255,0.22)', 8, '#58a6ff', 1, data ? data.prob : null, '#c9d1d9');
            return;
          }

          // 7600 -> 8200ms: Fade out / reset
          if (ms >= 7600) {
            const fade = Math.max(0, 1 - (ms - 7600) / 600);
            caption.style.opacity = `${fade}`;

            drawBracket(bracketL, Y_MID, bracketH, true, fade);
            drawBracket(bracketR, Y_MID, bracketH, false, fade);

            drawDotBatch(layout.positions, Y_MID, 1, 1, 1, '#58a6ff', 'rgba(88,166,255,0.22)', 8, '#58a6ff', fade, data ? data.prob : null, '#c9d1d9');
          }
        }

        function animLoop(now) {
          const elapsed = (now - startTime) % TOTAL_DURATION;
          render(elapsed);
          requestAnimationFrame(animLoop);
        }
        requestAnimationFrame(animLoop);

        canvasStage.addEventListener('click', () => {
          startTime = performance.now();
        });
      })();

      nextProblem();
    })();
  </script>
</body>
</html>
